[package]
name = "uc-toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Tool implementations exposed by uc-agent (system.health, system.metrics, system.logs, package.install, service.status)."

[dependencies]
uc-types = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

time = { workspace = true }
sysinfo = { workspace = true }
pbjson-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

# macOS Messages bridge (messages.rs): read the local chat.db. Bundled SQLite
# so there's no system libsqlite dependency. macOS-only — never built on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { workspace = true }
