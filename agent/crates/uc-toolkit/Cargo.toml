[package]
name = "uc-toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Tool implementations exposed by uc-agent (system.health, system.metrics, system.logs, package.install, service.status)."

[dependencies]
uc-types = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

# SQLite (bundled — no system libsqlite). Cross-platform: powers the files.* FTS5
# index on every device (Linux fleet included), and the macOS-only Messages bridge.
rusqlite = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

time = { workspace = true }
sysinfo = { workspace = true }
pbjson-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }
