#
# Example uc-agent configuration. Generated by install.sh; edit only if you
# need to deviate from defaults.

[agent]
mcp_port = 47000
heartbeat_interval = "30s"
register_timeout = "30s"

[control_plane]
# Default tailnet-direct URL; not Cloudflare-fronted, so SSE works.
base_url = "http://commander.unicorncommander.net:8084"
tls_skip_verify = false

[paths]
state_dir = "/var/lib/uc-agent"
cert_dir = "/var/lib/uc-agent/certs"

[bootstrap]
# Single-use registration token issued by ops-center.
# Cleared by the agent after successful registration.
token = "REPLACE_ME"
tier = "prod"
owner = "infra"
